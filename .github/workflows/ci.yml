name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # dcc-mcp-core is pinned to a range: the recipe tests assert the pack is
        # loadable by the real core recipe runtime (load_recipe_pack /
        # list_recipe_entries), so an unbounded core could change that contract
        # under CI. Bump deliberately.
        run: python -m pip install "dcc-mcp-core>=0.20.11,<0.21.0" "jsonschema>=4.18" "PyYAML>=6" pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Validate Skill contract
        run: >-
          python -c "from dcc_mcp_core import validate_skill;
          r=validate_skill('skill/lookdev-turntable'); print(r);
          raise SystemExit(1 if r.has_errors else 0)"
