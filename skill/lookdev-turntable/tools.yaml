tools:
  - name: get_preset
    description: Return the built-in camera-facing lower-left combined-turntable preset.
    source_file: scripts/get_preset.py
    execution: sync
    affinity: any
    enforce_thread_affinity: false
    timeout_hint_secs: 5
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
    input_schema:
      type: object
      properties: {}
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [preset, reference_kit]
          properties:
            preset:
              type: object
            reference_kit:
              type: object

  - name: recommend_hdr_preset
    description: Recommend a neutral PBR HDR profile for TT LookDev, with explicit overrides.
    source_file: scripts/recommend_hdr_preset.py
    execution: sync
    affinity: any
    enforce_thread_affinity: false
    timeout_hint_secs: 5
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
    input_schema:
      type: object
      required: [asset_type]
      properties:
        asset_type:
          type: string
          enum: [insect_macro, character_creature, hard_surface_product, glass_translucent, vegetation, environment]
        hdri_id:
          type: string
          enum: [studio_small_09, photo_studio_01, aristea_wreck_puresky, cloudy_vondelpark, studio_garden, soliltude, kloofendal_overcast, kloppenheim_01_puresky, cloud_layers]
        rotation_degrees:
          type: number
          minimum: 0
          maximum: 360
        exposure_ev:
          type: number
          minimum: -10
          maximum: 10
        white_balance_kelvin:
          type: integer
          minimum: 2000
          maximum: 12000
        ground_shadow_enabled:
          type: boolean
        ground_albedo_linear:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
            minimum: 0
            maximum: 1
        ground_roughness:
          type: number
          minimum: 0
          maximum: 1
        gray_linear_reflectance:
          type: number
          minimum: 0
          maximum: 1
        white_linear_reflectance:
          type: number
          minimum: 0
          maximum: 1
        chrome_base_color_linear:
          type: number
          minimum: 0
          maximum: 1
        chrome_roughness:
          type: number
          minimum: 0
          maximum: 1
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [profile, reference_kit]
          properties:
            profile:
              type: object
            reference_kit:
              type: object
    call_examples:
      - note: TT preset for a macro insect under neutral outdoor daylight.
        arguments:
          asset_type: insect_macro
      - note: Explicitly override the HDR orientation and exposure.
        arguments:
          asset_type: hard_surface_product
          rotation_degrees: 80
          exposure_ev: -0.5

  - name: validate_stage
    description: Validate one measured combined material-and-lighting LookDev sequence.
    source_file: scripts/validate_stage.py
    execution: sync
    affinity: any
    enforce_thread_affinity: false
    timeout_hint_secs: 5
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
    input_schema:
      type: object
      required:
        - visible_subjects
        - subject_transform_tracks
        - lighting_transform_tracks
        - reference_transform_tracks
        - environment_transform_tracks
        - camera_transform_tracks
        - reference_camera_space
        - reference_anchor
        - chart_plane_view_axis_degrees
        - subject_width_fraction
        - reference_width_fraction
        - clearance_width_fraction
        - gray_linear_reflectance
        - material_phase_frame_count
        - lighting_phase_frame_count
        - material_phase_subject_rotation_degrees
        - material_phase_lighting_rotation_degrees
        - lighting_phase_subject_rotation_degrees
        - lighting_phase_lighting_rotation_degrees
        - linear_interpolation
        - subject_material_valid
        - visible_light_geometry
        - native_rendered_frame_count
        - synthetic_interpolation_used
        - duration_seconds
        - fps
        - output_frame_count
        - auto_exposure_enabled
        - color_transform_valid
        - ocio_config_id
        - working_space
        - display
        - view_transform
        - output_encoding_count
        - gray_rendered_linear_luminance
        - highlight_clipping_fraction
        - color_texture_intent_valid
        - data_texture_intent_valid
      properties:
        visible_subjects:
          type: integer
          minimum: 0
        subject_transform_tracks:
          type: integer
          minimum: 0
          description: Transform tracks owned by SubjectRoot.
        lighting_transform_tracks:
          type: integer
          minimum: 0
          description: Transform tracks owned by LightingRoot.
        reference_transform_tracks:
          type: integer
          minimum: 0
        environment_transform_tracks:
          type: integer
          minimum: 0
          maximum: 1
          description: Transform tracks on the visible environment backdrop; use zero when fixed or one for the sole lighting-owned HDRI track.
        camera_transform_tracks:
          type: integer
          minimum: 0
        reference_camera_space:
          type: boolean
          description: Whether ReferenceRoot uses a camera-relative transform or constraint.
        reference_anchor:
          type: string
          enum: [lower-left]
        chart_plane_view_axis_degrees:
          type: number
          minimum: 0
          maximum: 180
          description: Angle between the ColorChecker plane and camera view axis; front-facing is 90 degrees.
        subject_width_fraction:
          type: number
          minimum: 0
          maximum: 1
        reference_width_fraction:
          type: number
          minimum: 0
          maximum: 1
        clearance_width_fraction:
          type: number
          minimum: 0
          maximum: 1
        gray_linear_reflectance:
          type: number
          minimum: 0
          maximum: 1
        material_phase_frame_count:
          type: integer
          minimum: 1
          description: Native output frames in the fixed-lighting subject-turntable phase.
        lighting_phase_frame_count:
          type: integer
          minimum: 1
          description: Native output frames in the fixed-subject lighting-turntable phase.
        material_phase_subject_rotation_degrees:
          type: number
          description: Total SubjectRoot rotation during the material-inspection phase.
        material_phase_lighting_rotation_degrees:
          type: number
          description: Total LightingRoot rotation during the material-inspection phase.
        lighting_phase_subject_rotation_degrees:
          type: number
          description: Total SubjectRoot rotation during the lighting-inspection phase.
        lighting_phase_lighting_rotation_degrees:
          type: number
          description: Total LightingRoot rotation during the lighting-inspection phase.
        linear_interpolation:
          type: boolean
        subject_material_valid:
          type: boolean
          description: Expected material slots are assigned with no fallback/default material.
        visible_light_geometry:
          type: boolean
          description: Whether any helper or emitter geometry is visible in the camera.
        native_rendered_frame_count:
          type: integer
          minimum: 1
          description: Frames rendered by the DCC renderer before video encoding.
        synthetic_interpolation_used:
          type: boolean
          description: Whether optical-flow or other synthetic frame generation was used.
        duration_seconds:
          type: number
          exclusiveMinimum: 0
        fps:
          type: number
          exclusiveMinimum: 0
        output_frame_count:
          type: integer
          minimum: 1
        auto_exposure_enabled:
          type: boolean
        color_transform_valid:
          type: boolean
          description: Legacy compatibility signal; detailed OCIO evidence below is also required.
        ocio_config_id:
          type: string
          minLength: 1
          description: Stable identifier, path, or hash for the active OCIO config.
        working_space:
          type: string
          enum: [ACEScg]
        display:
          type: string
          minLength: 1
          description: Resolved OCIO display used for review.
        view_transform:
          type: string
          minLength: 1
          description: Resolved OCIO view transform used for review.
        output_encoding_count:
          type: integer
          minimum: 0
          description: Number of display/output encodings applied from scene-linear pixels to review media; must be exactly one.
        gray_rendered_linear_luminance:
          type: number
          minimum: 0
          description: Median scene-linear luminance measured on the rendered 18% gray sphere before the display transform.
        highlight_clipping_fraction:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of finite scene-linear RGB samples above 1.0 in the preview.
        color_texture_intent_valid:
          type: boolean
          description: Base Color and chart inputs resolve to declared color spaces.
        data_texture_intent_valid:
          type: boolean
          description: Normal, Roughness, Metallic, and AO inputs resolve as data/non-color.
        pbr_validation_mode:
          type: boolean
          default: true
        stylized_tint_enabled:
          type: boolean
          default: false
          description: Must remain false while PBR validation mode is enabled.
        hdri_contains_sun:
          type: boolean
          default: false
        additional_sun_lights:
          type: integer
          minimum: 0
          default: 0
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [passed, failures]
          properties:
            passed:
              type: boolean
            failures:
              type: array
              items:
                type: string
    call_examples:
      - note: Validate the combined material and lighting inspection sequence.
        arguments:
          visible_subjects: 1
          subject_transform_tracks: 1
          lighting_transform_tracks: 1
          reference_transform_tracks: 0
          environment_transform_tracks: 1
          camera_transform_tracks: 0
          reference_camera_space: true
          reference_anchor: lower-left
          chart_plane_view_axis_degrees: 90
          subject_width_fraction: 0.62
          reference_width_fraction: 0.10
          clearance_width_fraction: 0.09
          gray_linear_reflectance: 0.18
          material_phase_frame_count: 180
          lighting_phase_frame_count: 180
          material_phase_subject_rotation_degrees: 360
          material_phase_lighting_rotation_degrees: 0
          lighting_phase_subject_rotation_degrees: 0
          lighting_phase_lighting_rotation_degrees: 360
          linear_interpolation: true
          subject_material_valid: true
          visible_light_geometry: false
          native_rendered_frame_count: 360
          synthetic_interpolation_used: false
          duration_seconds: 12
          fps: 30
          output_frame_count: 360
          auto_exposure_enabled: false
          color_transform_valid: true
          ocio_config_id: maya-builtin-aces-1.3
          working_space: ACEScg
          display: sRGB
          view_transform: ACES 1.0 SDR-video
          output_encoding_count: 1
          gray_rendered_linear_luminance: 0.18
          highlight_clipping_fraction: 0.0
          color_texture_intent_valid: true
          data_texture_intent_valid: true
          pbr_validation_mode: true
          stylized_tint_enabled: false
          hdri_contains_sun: true
          additional_sun_lights: 0
