tools:
  - name: get_preset
    description: Return the built-in camera-facing lower-left dual-turntable preset.
    source_file: scripts/preset.py
    execution: sync
    affinity: any
    enforce_thread_affinity: false
    timeout_hint_secs: 5
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
    input_schema:
      type: object
      properties: {}
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [preset, reference_kit]
          properties:
            preset:
              type: object
            reference_kit:
              type: object

  - name: validate_stage
    description: Validate one measured take against the standard dual-turntable LookDev preset.
    source_file: scripts/validate_stage.py
    execution: sync
    affinity: any
    enforce_thread_affinity: false
    timeout_hint_secs: 5
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
    input_schema:
      type: object
      required:
        - take_mode
        - visible_subjects
        - subject_transform_tracks
        - lighting_transform_tracks
        - reference_transform_tracks
        - environment_transform_tracks
        - camera_transform_tracks
        - reference_camera_space
        - reference_anchor
        - chart_plane_view_axis_degrees
        - subject_width_fraction
        - reference_width_fraction
        - clearance_width_fraction
        - gray_linear_reflectance
        - duration_seconds
        - fps
        - output_frame_count
        - auto_exposure_enabled
        - color_transform_valid
      properties:
        take_mode:
          type: string
          enum: [subject_turntable, lighting_turntable]
        visible_subjects:
          type: integer
          minimum: 0
        subject_transform_tracks:
          type: integer
          minimum: 0
          description: Transform tracks owned by SubjectRoot.
        lighting_transform_tracks:
          type: integer
          minimum: 0
          description: Transform tracks owned by LightingRoot.
        reference_transform_tracks:
          type: integer
          minimum: 0
        environment_transform_tracks:
          type: integer
          minimum: 0
          description: Transform tracks on the visible environment backdrop.
        camera_transform_tracks:
          type: integer
          minimum: 0
        reference_camera_space:
          type: boolean
          description: Whether ReferenceRoot uses a camera-relative transform or constraint.
        reference_anchor:
          type: string
          enum: [lower-left]
        chart_plane_view_axis_degrees:
          type: number
          minimum: 0
          maximum: 180
          description: Angle between the ColorChecker plane and camera view axis; front-facing is 90 degrees.
        subject_width_fraction:
          type: number
          minimum: 0
          maximum: 1
        reference_width_fraction:
          type: number
          minimum: 0
          maximum: 1
        clearance_width_fraction:
          type: number
          minimum: 0
          maximum: 1
        gray_linear_reflectance:
          type: number
          minimum: 0
          maximum: 1
        duration_seconds:
          type: number
          exclusiveMinimum: 0
        fps:
          type: number
          exclusiveMinimum: 0
        output_frame_count:
          type: integer
          minimum: 1
        auto_exposure_enabled:
          type: boolean
        color_transform_valid:
          type: boolean
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [passed, take_mode, failures]
          properties:
            passed:
              type: boolean
            take_mode:
              type: string
            failures:
              type: array
              items:
                type: string
    call_examples:
      - note: Validate the fixed-lighting subject turntable.
        arguments:
          take_mode: subject_turntable
          visible_subjects: 1
          subject_transform_tracks: 1
          lighting_transform_tracks: 0
          reference_transform_tracks: 0
          environment_transform_tracks: 0
          camera_transform_tracks: 0
          reference_camera_space: true
          reference_anchor: lower-left
          chart_plane_view_axis_degrees: 90
          subject_width_fraction: 0.62
          reference_width_fraction: 0.10
          clearance_width_fraction: 0.09
          gray_linear_reflectance: 0.18
          duration_seconds: 12
          fps: 30
          output_frame_count: 360
          auto_exposure_enabled: false
          color_transform_valid: true
      - note: Validate the fixed-subject lighting turntable.
        arguments:
          take_mode: lighting_turntable
          visible_subjects: 1
          subject_transform_tracks: 0
          lighting_transform_tracks: 1
          reference_transform_tracks: 0
          environment_transform_tracks: 0
          camera_transform_tracks: 0
          reference_camera_space: true
          reference_anchor: lower-left
          chart_plane_view_axis_degrees: 90
          subject_width_fraction: 0.62
          reference_width_fraction: 0.10
          clearance_width_fraction: 0.09
          gray_linear_reflectance: 0.18
          duration_seconds: 12
          fps: 30
          output_frame_count: 360
          auto_exposure_enabled: false
          color_transform_valid: true
