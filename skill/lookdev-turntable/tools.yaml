tools:
  - name: validate_stage
    description: Validate measured scene and render facts against the standard LookDev turntable contract.
    source_file: scripts/validate_stage.py
    execution: sync
    affinity: any
    enforce_thread_affinity: false
    timeout_hint_secs: 5
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
    input_schema:
      type: object
      required:
        - visible_subjects
        - subject_transform_tracks
        - reference_transform_tracks
        - environment_transform_tracks
        - camera_transform_tracks
        - subject_width_fraction
        - reference_width_fraction
        - clearance_width_fraction
        - gray_linear_reflectance
        - duration_seconds
        - fps
        - output_frame_count
        - auto_exposure_enabled
        - color_transform_valid
      properties:
        visible_subjects:
          type: integer
          minimum: 0
        subject_transform_tracks:
          type: integer
          minimum: 0
        reference_transform_tracks:
          type: integer
          minimum: 0
        environment_transform_tracks:
          type: integer
          minimum: 0
        camera_transform_tracks:
          type: integer
          minimum: 0
        subject_width_fraction:
          type: number
          minimum: 0
          maximum: 1
        reference_width_fraction:
          type: number
          minimum: 0
          maximum: 1
        clearance_width_fraction:
          type: number
          minimum: 0
          maximum: 1
        gray_linear_reflectance:
          type: number
          minimum: 0
          maximum: 1
        duration_seconds:
          type: number
          exclusiveMinimum: 0
        fps:
          type: number
          exclusiveMinimum: 0
        output_frame_count:
          type: integer
          minimum: 1
        auto_exposure_enabled:
          type: boolean
        color_transform_valid:
          type: boolean
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [passed, failures]
          properties:
            passed:
              type: boolean
            failures:
              type: array
              items:
                type: string
    call_examples:
      - note: Validate the standard 12-second, 30-fps stage after rendering.
        arguments:
          visible_subjects: 1
          subject_transform_tracks: 1
          reference_transform_tracks: 0
          environment_transform_tracks: 0
          camera_transform_tracks: 0
          subject_width_fraction: 0.62
          reference_width_fraction: 0.10
          clearance_width_fraction: 0.09
          gray_linear_reflectance: 0.18
          duration_seconds: 12
          fps: 30
          output_frame_count: 360
          auto_exposure_enabled: false
          color_transform_valid: true
